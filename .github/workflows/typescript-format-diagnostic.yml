# Temporary diagnostic: removed once the existing sources are formatted.
name: TypeScript formatting diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install npm 11
        run: npm install -g npm@11
      - name: Install dependencies
        run: npm ci --include=dev --include=optional
      - name: Show official Prettier output as a patch
        run: |
          npm run format:ts:fix
          echo 'PRETTIER_PATCH_BEGIN'
          git --no-pager diff --no-color -- src tests 'vite*.ts' vitest.config.ts
          echo 'PRETTIER_PATCH_END'
          git diff --exit-code --quiet -- src tests 'vite*.ts' vitest.config.ts
