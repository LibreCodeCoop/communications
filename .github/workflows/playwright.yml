name: Playwright
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: communications-playwright-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  requirements:
    runs-on: ubuntu-latest
    outputs:
      nextcloud: ${{ steps.compatibility.outputs.nextcloud_max }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read PHP requirement from appinfo/info.xml
        id: compatibility
        run: python3 scripts/ci/read_app_requirements.py >> "$GITHUB_OUTPUT"
  playwright:
    name: Nextcloud ${{ needs.requirements.outputs.nextcloud }} / ${{ matrix.database }}
    needs: requirements
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, pgsql, mariadb]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci --include=dev --include=optional
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Provision isolated Nextcloud, database and optional LibreSign
        run: bash scripts/ci/bootstrap.sh '${{ matrix.database }}'
        env:
          INSTALL_LIBRESIGN: ${{ matrix.database == 'sqlite' && '1' || '0' }}
      - name: Verify attribute routes against the original route contract
        run: docker exec -u www-data "$NC_CONTAINER" php /var/www/html/custom_apps/communications/tests/ci/assert-routes.php
      - name: Verify publication and recipient isolation
        run: npx playwright test tests/e2e/app-smoke.spec.mjs
      - name: Verify generic LibreSign completion contract
        if: matrix.database == 'sqlite'
        run: npm run test:e2e:libresign
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.database }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Shutdown isolated test environment
        if: always()
        run: docker compose -f tests/ci/compose.yml -p communications-ci down --volumes --remove-orphans || true
        env:
          NC_TEST_PASSWORD: ephemeral-cleanup-only
