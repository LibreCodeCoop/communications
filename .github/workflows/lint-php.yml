name: Lint PHP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: communications-lint-php-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  lint-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read PHP requirement from appinfo/info.xml
        id: compatibility
        run: python3 scripts/ci/read_app_requirements.py >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ steps.compatibility.outputs.php_min }}
          extensions: mbstring, intl, dom, xml, zip, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: bash scripts/ci/php-lint.sh
